<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Too Fresh To Waste — Screen 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

body{
  background:#060a0b;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Inter',sans-serif;
}

/* ── Phone shell ── */
.phone{
  width:390px;
  height:844px;
  background:#0a3338;
  border-radius:54px;
  position:relative;
  overflow:hidden;
  visibility:hidden;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.08),
    0 0 0 10px #111,
    0 0 0 12px #1e1e1e,
    0 60px 120px rgba(0,0,0,.9),
    0 20px 40px rgba(0,0,0,.6);
}

/* Dynamic island */
.pill{
  position:absolute;
  top:13px;left:50%;
  transform:translateX(-50%);
  width:120px;height:34px;
  background:#000;
  border-radius:20px;
  z-index:200;
}

/* ── Status bar ── */
.statusbar{
  position:absolute;
  top:0;left:0;right:0;
  height:54px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  padding:0 28px 8px;
  z-index:100;
}
.sb-time{
  font-size:15px;
  font-weight:600;
  color:#fff;
  letter-spacing:-.3px;
}
.sb-icons{
  display:flex;
  align-items:center;
  gap:5px;
}
.sb-icons svg{
  fill:#fff;
}

/* ── Logo ── */
.logo{
  position:absolute;
  top:62px;left:24px;
  display:flex;
  align-items:center;
  gap:8px;
  z-index:10;
}
.logo-name{
  font-size:16px;
  font-weight:700;
  color:#fff;
  line-height:1.22;
  letter-spacing:-.2px;
}

/* ── Headline ── */
.headline{
  position:absolute;
  top:148px;
  left:20px;right:18px;
  z-index:10;
  transform:rotate(-4.5deg);
  transform-origin:left center;
}
.headline .line{
  font-family:'Bebas Neue',sans-serif;
  font-size:72px;
  font-weight:400;
  letter-spacing:2px;
  display:block;
  line-height:0.92;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
.headline .white{color:#fff;}
.headline .red{color:#F04535;}

/* ── Body text ── */
.bodytext{
  position:absolute;
  top:358px;
  left:24px;
  width:190px;
  font-size:14.5px;
  color:rgba(255,255,255,.8);
  line-height:1.58;
  font-weight:400;
  z-index:10;
}



/* ── Food photo wrapper — centered ── */
.food-wrap{
  position:absolute;
  bottom:130px;
  left:50%;
  transform:translateX(-50%);
  width:265px;
  height:265px;
  z-index:5;
  filter:drop-shadow(0 18px 36px rgba(0,0,0,.7));
}
.food-wrap img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center 45%;
  border-radius:50%;
  display:block;
}

/* ── Bottom chrome ── */
.bottom{
  position:absolute;
  bottom:0;left:0;right:0;
  padding:0 22px 38px;
  z-index:20;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:0;
}

.btn-start{
  width:100%;
  background:#F04535;
  color:#fff;
  border:none;
  border-radius:50px;
  padding:18px 24px;
  font-size:17px;
  font-weight:700;
  font-family:'Inter',sans-serif;
  letter-spacing:.02em;
  cursor:pointer;
  box-shadow:
    0 8px 28px rgba(240,69,53,.5),
    0 2px 8px rgba(0,0,0,.3);
  margin-bottom:14px;
}

.skip{
  font-size:15px;
  color:rgba(255,255,255,.75);
  font-weight:500;
  background:none;
  border:none;
  cursor:pointer;
  font-family:'Inter',sans-serif;
  margin-bottom:14px;
}

.dots{
  display:flex;
  gap:7px;
  align-items:center;
}
.dot{
  width:8px;height:8px;
  border-radius:50%;
  background:rgba(255,255,255,.32);
}
.dot.active{
  background:#F04535;
  width:22px;
  border-radius:4px;
}
</style>
</head>
<body>

<div class="phone">

  <!-- Dynamic island -->
  <div class="pill"></div>

  <!-- Status bar -->
  <div class="statusbar">
    <span class="sb-time">9:41</span>
    <div class="sb-icons">
      <!-- Signal -->
      <svg width="17" height="12" viewBox="0 0 17 12">
        <rect x="0" y="8" width="3" height="4" rx=".8"/>
        <rect x="4.5" y="5.5" width="3" height="6.5" rx=".8"/>
        <rect x="9" y="3" width="3" height="9" rx=".8"/>
        <rect x="13.5" y="0" width="3" height="12" rx=".8"/>
      </svg>
      <!-- WiFi -->
      <svg width="16" height="12" viewBox="0 0 16 12">
        <path d="M8 9.5a1.5 1.5 0 100 3 1.5 1.5 0 000-3z"/>
        <path d="M3.8 6.4a6 6 0 018.4 0" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M1 3.6A10 10 0 0115 3.6" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <!-- Battery -->
      <svg width="25" height="12" viewBox="0 0 25 12">
        <rect x=".5" y=".5" width="21" height="11" rx="3" stroke="#fff" stroke-width="1" fill="none"/>
        <rect x="22" y="3.5" width="2.5" height="5" rx="1.2" fill="rgba(255,255,255,.5)"/>
        <rect x="2" y="2" width="16" height="8" rx="2" fill="#fff"/>
      </svg>
    </div>
  </div>

  <!-- Logo -->
  <div class="logo">
    <img src="../apps/mobile/src/assets/images/leaf-logo.svg"
         width="40" height="40"
         style="object-fit:contain;"
         alt="Too Fresh To Waste leaf logo"/>
    <div class="logo-name">Too Fresh To Waste</div>
  </div>

  <!-- Headline -->
  <div class="headline">
    <span class="line white">GOOD FOOD</span>
    <span class="line red">LESS WASTE</span>
    <span class="line white">MORE IMPACT</span>
  </div>

  <!-- Body text -->
  <p class="bodytext">Delicious food from local businesses at a lower price. Together, we waste less and do more.</p>


  <!-- Pasta food photo -->
  <div class="food-wrap">
    <img
      src="https://images.unsplash.com/photo-1563379926898-05f4575a45d8?w=580&q=85&auto=format&fit=crop"
      alt="Pasta bowl"
      crossorigin="anonymous"
      onerror="this.style.display='none';this.nextElementSibling.style.display='block';"
    />
    <!-- SVG fallback (hidden unless image fails) -->
    <svg style="display:none;width:100%;height:100%" viewBox="0 0 290 290" fill="none">
      <defs>
        <radialGradient id="fb" cx="38%" cy="28%"><stop offset="0%" stop-color="#f8f0e3"/><stop offset="100%" stop-color="#b8a48a"/></radialGradient>
        <radialGradient id="fs" cx="45%" cy="40%"><stop offset="0%" stop-color="#e85040"/><stop offset="100%" stop-color="#8b1008"/></radialGradient>
        <radialGradient id="ft" cx="35%" cy="28%"><stop offset="0%" stop-color="#ff6055"/><stop offset="100%" stop-color="#a01008"/></radialGradient>
        <linearGradient id="fp" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8d9a0"/><stop offset="100%" stop-color="#c8a040"/></linearGradient>
      </defs>
      <circle cx="145" cy="145" r="140" fill="#e8d8c0" opacity=".3"/>
      <ellipse cx="145" cy="145" rx="120" ry="60" fill="url(#fb)"/>
      <ellipse cx="145" cy="118" rx="120" ry="32" fill="#f0e0c0"/>
      <ellipse cx="145" cy="116" rx="98" ry="22" fill="url(#fs)"/>
      <rect x="88" y="100" width="20" height="32" rx="6" fill="url(#fp)" transform="rotate(-15,98,116)"/>
      <rect x="112" y="98" width="20" height="32" rx="6" fill="url(#fp)" transform="rotate(5,122,114)"/>
      <rect x="140" y="100" width="20" height="30" rx="6" fill="url(#fp)" transform="rotate(-6,150,115)"/>
      <rect x="166" y="102" width="18" height="28" rx="5" fill="url(#fp)" transform="rotate(12,175,116)"/>
      <circle cx="104" cy="104" r="14" fill="url(#ft)"/>
      <ellipse cx="99" cy="99" rx="5" ry="3" fill="rgba(255,180,160,.4)" transform="rotate(-20,99,99)"/>
      <circle cx="172" cy="106" r="12" fill="#c01808"/>
      <ellipse cx="135" cy="98" rx="14" ry="6" fill="#2e7d32" transform="rotate(-22,135,98)"/>
      <ellipse cx="152" cy="96" rx="12" ry="5" fill="#388e3c" transform="rotate(12,152,96)"/>
    </svg>
  </div>

  <!-- Bottom -->
  <div class="bottom">
    <button class="btn-start">Get Started</button>
    <button class="skip">Skip for now</button>
    <div class="dots">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

</div>

<script>
  document.fonts.ready.then(function(){
    document.querySelector('.phone').style.visibility='visible';
  });
</script>
</body>
</html>
