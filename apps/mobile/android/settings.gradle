// ============================================================================
// React Native 0.81 Android Settings - PNPM Monorepo Configuration
// ============================================================================
// Source: https://github.com/react-native-community/template/blob/0.77-stable/template/android/settings.gradle
// Monorepo: apps/mobile/android/settings.gradle
//
// React Native Gradle Plugin configuration:
// - includeBuild appears twice: in pluginManagement{} and at root level
// - PNPM stores plugin in workspace root virtual store: C:/WFA/node_modules/.pnpm/
// - Relative path from apps/mobile/android/: ../../../node_modules/.pnpm/@react-native+gradle-plugin@0.81.0/
// - Autolinking powered by @react-native-community/cli config command

pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    includeBuild("../../../node_modules/.pnpm/@react-native+gradle-plugin@0.81.0/node_modules/@react-native/gradle-plugin")
}

plugins {
    id("com.facebook.react.settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { reactSettings ->
    reactSettings.autolinkLibrariesFromCommand()
}

rootProject.name = 'FoodWasteApp'

include ':app'

includeBuild('../../../node_modules/.pnpm/@react-native+gradle-plugin@0.81.0/node_modules/@react-native/gradle-plugin')
