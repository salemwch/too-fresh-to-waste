// ============================================================================
// React Native 0.81 Android Settings - PNPM Monorepo Configuration
// ============================================================================
// Source: https://github.com/react-native-community/template/blob/0.77-stable/template/android/settings.gradle
// Monorepo: apps/mobile/android/settings.gradle
//
// PNPM uses node-linker=hoisted: all packages at workspace root node_modules/
// Autolink powered by @react-native-community/cli config command

// pluginManagement MUST be the first block in settings.gradle (Gradle requirement)
pluginManagement {
    includeBuild("../../../node_modules/@react-native/gradle-plugin")
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id("com.facebook.react.settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { reactSettings ->
    reactSettings.autolinkLibrariesFromCommand()
}

// Single source of truth for node_modules path in settings.gradle scope.
// From apps/mobile/android/ → 3 levels up to monorepo root node_modules/
def nodeModulesDir = "$rootDir/../../../node_modules"

rootProject.name = 'FoodWasteApp'

include ':app'

// ============================================================================
// Manual includes for Nitro-based libraries
// These libraries use Nitro Modules which require manual project inclusion
// because their CMake/codegen autolinking is disabled in react-native.config.js
// Source: https://nitro.margelo.com/docs/minimum-requirements
// ============================================================================
include ':react-native-nitro-modules'
project(':react-native-nitro-modules').projectDir = new File("${nodeModulesDir}/react-native-nitro-modules/android")

include ':react-native-mmkv'
project(':react-native-mmkv').projectDir = new File("${nodeModulesDir}/react-native-mmkv/android")

includeBuild("${nodeModulesDir}/@react-native/gradle-plugin")
