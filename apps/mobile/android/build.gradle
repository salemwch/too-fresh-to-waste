// TOP-LEVEL BUILD FILE - Food Waste Mobile App

// ============================================================================
// React Native 0.87.1 + Android Gradle Plugin 9.2.1 (version supplied by the RN gradle plugin)
// Source: https://reactnative.dev/docs/environment-setup
//
// PROPERTY RESOLUTION PATTERN:
// ┌─────────────────────────────────────────────────────────────────────────┐
// │  gradle.properties  →  Source of Truth (Project Properties)            │
// │         ↓                                                              │
// │  ext{} block        →  Reads from properties (Backward Compatibility)  │
// │         ↓                                                              │
// │  Native modules     →  Can access via rootProject.ext.* or properties  │
// └─────────────────────────────────────────────────────────────────────────┘
//
// Why this pattern?
// - AGP 8.8+ and React Native Kotlin DSL check rootProject.properties[]
// - Legacy native modules (reanimated, maps) use rootProject.ext.*
// - This ensures both access patterns work correctly
//
// npm package locations (react-native, codegen, hermes-compiler, ...) are
// resolved by Node in settings.gradle and published as gradle.ext.npmPackageDirs.
// Nothing in the Gradle build assumes where pnpm puts node_modules.

buildscript {
    ext {
        // ====================================================================
        // ANDROID SDK/NDK VERSIONS
        // ====================================================================
        // Read from gradle.properties (project properties) with hardcoded fallbacks.
        // Source of truth is gradle.properties - these fallbacks are safety nets only.
        // Source: https://developer.android.com/studio/projects/configure-agp-ndk

        // SDK Versions - React Native 0.87.1 template
        buildToolsVersion = findProperty('buildToolsVersion') ?: "37.0.0"
        minSdkVersion = findProperty('minSdkVersion')?.toInteger() ?: 24
        compileSdkVersion = findProperty('compileSdkVersion')?.toInteger() ?: 37
        targetSdkVersion = findProperty('targetSdkVersion')?.toInteger() ?: 36

        // NDK Version - React Native 0.87.1 template (unchanged since 0.81)
        ndkVersion = findProperty('ndkVersion') ?: "27.1.12297006"

        /*
         * Glide, read by react-native-fast-image via safeExtGet('glideVersion').
         *
         * Its own default is 4.12.0 - a 2021 release - and fast-image 8.6.3 is
         * unmaintained, so nothing was ever going to move it. Glide decodes every
         * offer image in the app, so four years of decoder and memory fixes are
         * worth having on their own merits.
         *
         * Play Console's "bitmap image optimisation" advice on release 86 points
         * at `glide...HttpUrlFetcher` and `glide...ImageDecoderResourceDecoder`
         * (deobfuscated from `au0.d` and `yu0.r`/`yu0.w`), which are Glide's own
         * internals - not app code. Nothing in src/ downloads or decodes an image
         * by hand; every one of the 11 image call sites uses fast-image. So this
         * bump is the only lever that exists on that item short of replacing the
         * library.
         *
         * 4.16.0, NOT 5.x. Glide's latest is 5.0.9, but 4 -> 5 is a cross-major
         * move inside an unmaintained wrapper whose Java calls Glide's API
         * directly - exactly the shape `.claude/rules/dependencies.md` warns
         * about. 4.16.0 is the last release on the major fast-image was built
         * against.
         */
        glideVersion = findProperty('glideVersion') ?: "4.16.0"

        // ====================================================================
        // REACT NATIVE CONFIGURATION
        // ====================================================================
        // These are read from gradle.properties for consistency
        hermesEnabled = findProperty('hermesEnabled')?.toBoolean() ?: true
        newArchEnabled = findProperty('newArchEnabled')?.toBoolean() ?: false

        // ====================================================================
        // DEPENDENCY VERSIONS
        // ====================================================================
        // Kotlin and Firebase versions for native module compilation
        kotlinVersion = findProperty('kotlinVersion') ?: "2.2.0"
        googleServicesVersion = "4.4.2"
        firebaseBomVersion = "33.16.0"
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // AGP and the Kotlin Gradle plugin carry no version here, exactly as in
        // the React Native 0.87.1 template: the RN gradle plugin (included from
        // node_modules in settings.gradle) depends on AGP 9.2.1 and KGP 2.2.0,
        // so React Native is the single source of truth for both and they can
        // never drift from the versions RN was built and tested against.
        // Source: react-native-gradle-plugin 0.87.1 gradle/libs.versions.toml
        classpath("com.android.tools.build:gradle")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.facebook.react:react-native-gradle-plugin")

        // Google Services plugin for Firebase
        classpath("com.google.gms:google-services:$googleServicesVersion")

        // Firebase Crashlytics removed — using Sentry for crash reporting

        // Baseline Profile plugin, applied to :app and :baselineprofile; must match
        // the benchmark libraries in baselineprofile/build.gradle.
        //
        // 1.4.1, NOT 1.5.0 (latest stable, 2026-10-05). With android.newDsl=false -
        // which RN 0.87 requires - 1.5.0 copies the release Kotlin source set into
        // nonMinifiedRelease/benchmarkRelease as the literal path "app/provider(?)"
        // (a Provider stringified), and compileProductionNonMinifiedReleaseKotlin
        // fails with InvalidPathException. Same build, plugin swapped to 1.4.1: the
        // copied set is the correct src/release/kotlin. 1.4.1 prints "tested with
        // versions below" this AGP; that warning is left visible on purpose.
        // Revisit with a 1.5.x patch or once newDsl=false can be dropped.
        // Source: https://developer.android.com/jetpack/androidx/releases/benchmark
        classpath("androidx.benchmark:benchmark-baseline-profile-gradle-plugin:1.4.1")
        // Note: React Native Gradle Plugin is loaded via includeBuild() in settings.gradle
        // It's applied in app/build.gradle using: plugins { id("com.facebook.react") }
    }
}

allprojects {
    // React Native artifacts come from Maven Central. The former local
    // repositories (node_modules/jsc-android/dist, node_modules/react-native/android)
    // no longer exist in either package and are absent from the RN template.
    repositories {
        google()
        mavenCentral()
    }

    // react-android / hermes-android versions and the `react-native` ->
    // `react-android` substitution are NOT declared here: the RN gradle plugin's
    // DependencyUtils.configureDependencies applies both forces and the
    // substitution to rootProject.allprojects, reading the versions from the
    // resolved react-native package. Hand-written copies could only drift.
    configurations.all {
        resolutionStrategy {
            // androidx.core is no longer forced. The old force held it at 1.13.1
            // because 1.16+ needed AGP 8.6+; the build is on AGP 9.2.1, so the
            // reason is gone and a downgrade force could only cause runtime
            // NoSuchMethodErrors in libraries built against a newer core.

            // Force Google Play Services versions for compatibility
            // Firebase BOM 33.7.0 requires GMS 18.5.0+ / 21.3.0+
            // react-native-geolocation-service 5.3.1 compatible with GMS 21.3.0
            // react-native-maps 1.15.6 (stable with RN 0.81.0) uses GMS Maps 18.0.x
            // Source: https://firebase.google.com/support/release-notes/android
            //
            // basement MUST move with base. Dependabot bumped `base` to 18.10.1
            // and `tasks` to 18.4.1 (PRs #32 and #31) but nothing touched this
            // `basement` pin, which sat at 18.4.0 and forced basement BACKWARDS
            // while base went forwards. base 18.10.1 references classes that only
            // exist in basement 18.10+, so R8 failed the release build with five
            // missing classes - ConnectionThrottlingConfig, GmsClientFlags,
            // InternalClientFlagRegistry, InternalClientFlags and
            // AttributionSourceWrapper.
            //
            // Nothing else caught it: type-check, lint, 4950 tests and the web
            // build all passed. Only `assembleProductionRelease` fails, and that
            // is not part of `pnpm test`. If you bump any play-services artifact,
            // re-run the release build.
            //
            // 18.11.0 is the highest version anything in the graph asks for, so
            // it satisfies every consumer rather than just the one that broke.
            force("com.google.android.gms:play-services-base:18.10.1")
            force("com.google.android.gms:play-services-location:21.3.0")
            force("com.google.android.gms:play-services-maps:19.0.0")
            force("com.google.android.gms:play-services-basement:18.11.0")
            force("com.google.android.gms:play-services-tasks:18.4.1")

            // ================================================================
            // SECURITY: Force vulnerable transitive dependencies to patched versions
            // Fixes Snyk-flagged io.netty, protobuf, and junit vulnerabilities
            // from AGP test infrastructure and Firebase/gRPC transitive deps.
            // ================================================================
            force("io.netty:netty-codec-http2:4.2.18.Final")
            force("io.netty:netty-codec-http:4.2.18.Final")
            force("io.netty:netty-codec:4.2.18.Final")
            force("io.netty:netty-handler:4.2.18.Final")
            force("io.netty:netty-handler-proxy:4.2.18.Final")
            force("io.netty:netty-common:4.2.18.Final")
            force("io.netty:netty-transport:4.2.18.Final")
            force("io.netty:netty-transport-native-unix-common:4.2.18.Final")
            force("io.netty:netty-buffer:4.2.18.Final")
            force("io.netty:netty-resolver:4.2.18.Final")
            // protobuf-java: a security FLOOR per major line, not a force.
            // GHSA-735f-pc8j-v9w8 (CVE-2024-7254) is patched in 3.25.5, 4.27.5 and
            // 4.28.2. A blanket force("...:3.25.5") also DOWNGRADED the Unified Test
            // Platform of AGP 9.2, which needs protobuf 4.28.x, and every connected
            // test died with NoClassDefFoundError com/google/protobuf/RuntimeVersion.
            // This raises vulnerable versions within their own line and never
            // lowers a newer one. Source: https://github.com/advisories/GHSA-735f-pc8j-v9w8
            eachDependency { details ->
                def req = details.requested
                if (req.group != "com.google.protobuf" || req.name != "protobuf-java" || !req.version) return
                def parts = (req.version.split("[.-]") as List) + ["0", "0", "0"]
                def (major, minor, patch) = parts.take(3).collect { part ->
                    def digits = (part =~ /^\d+/)
                    digits.find() ? digits.group() as int : 0
                }
                def floor = null
                if (major == 3 && (minor < 25 || (minor == 25 && patch < 5))) floor = "3.25.5"
                else if (major == 4 && (minor < 27 || (minor == 27 && patch < 5))) floor = "4.27.5"
                else if (major == 4 && minor == 28 && patch < 2) floor = "4.28.2"
                if (floor) {
                    details.useVersion(floor)
                    details.because("GHSA-735f-pc8j-v9w8: patched version within the requested major line")
                }
            }
            force("junit:junit:4.13.2")
            // 2.2.10: react-android 0.87.1's POM requires kotlin-stdlib 2.2.10.
            // Forcing anything lower would run RN against an older stdlib than
            // it was compiled for.
            force("org.jetbrains.kotlin:kotlin-stdlib:2.2.10")
            force("org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.10")
            force("org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.2.10")
        }

        // Exclude deprecated Firebase Instance ID (firebase-iid)
        // Deprecated in Firebase BOM 28+, removed in BOM 30+
        // Functionality moved to firebase-messaging
        // Source: https://firebase.google.com/support/release-notes/android
        exclude group: 'com.google.firebase', module: 'firebase-iid'
    }
}

// ============================================================================
// ENTERPRISE: NEW ARCHITECTURE COMPATIBILITY PATCHES
// ============================================================================
// React Native 0.81+ New Architecture requires special handling for legacy libraries.
// Many libraries try to apply 'com.facebook.react' plugin when newArchEnabled=true,
// but this plugin is only available via includeBuild() for the app module.
//
// Solution: Disable newArchEnabled for problematic libraries - RN 0.81's autolinking
// handles codegen through codegenConfig in package.json, not manual plugin application.
//
// Source: https://reactnative.dev/docs/new-architecture-intro
// Source: https://github.com/facebook/react-native/issues/53926

// Libraries that manually apply com.facebook.react plugin (incompatible with RN 0.81)
// NOTE: @react-native-async-storage/async-storage v2.2.0+ supports New Architecture
// as a pure Java TurboModule - no longer needs to be in this list
def newArchIncompatibleLibraries = [
    // Add problematic libraries here as discovered
]

// Apply patches to incompatible libraries before their build.gradle is evaluated
gradle.beforeProject { project ->
    if (newArchIncompatibleLibraries.contains(project.name)) {
        // Set property BEFORE any build.gradle is evaluated
        // This overrides gradle.properties value for this specific project
        project.ext.set('newArchEnabled', 'false')
        logger.lifecycle("[New Arch Patch] Disabled newArchEnabled for ${project.name}")
    }
}

// ============================================================================
// ENTERPRISE: AGP 8+ NAMESPACE & SDK COMPATIBILITY PATCHES
// ============================================================================
// AGP 8.0+ requires all Android modules to declare namespace in build.gradle
// Many legacy React Native libraries still use package attribute in AndroidManifest.xml
// This block patches those libraries at configuration time
// Source: https://developer.android.com/r/tools/upgrade-assistant/set-namespace
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                // ================================================================
                // FORCE compileSdk FOR LIBRARIES THAT DON'T PROPERLY READ ext{}
                // ================================================================
                // Some libraries fail to read rootProject.ext.compileSdkVersion
                // Force compileSdk to ensure all modules compile correctly
                // Note: android.compileSdkVersion returns String like "android-35", extract the number
                def currentSdk = android.compileSdkVersion?.toString()?.replaceAll(/[^0-9]/, '')?.toInteger() ?: 0
                def targetSdk = rootProject.ext.compileSdkVersion
                if (currentSdk < targetSdk) {
                    compileSdk targetSdk
                    logger.info("[SDK Patch] Forced compileSdk=${targetSdk} for ${project.name}")
                }

                // ================================================================
                // FORCE ndkVersion FOR ALL NATIVE MODULES (CXX5106 fix)
                // ================================================================
                // AGP 8.8+ deprecated ndk.dir in local.properties
                // Must set android.ndkVersion in all modules with native code
                // Source: https://developer.android.com/r/studio-ui/ndk-dir
                ndkVersion rootProject.ext.ndkVersion

                // Patch react-native-geolocation-service
                // Package name extracted from AndroidManifest.xml
                if (project.name == 'react-native-geolocation-service') {
                    namespace = 'com.agontuk.RNFusedLocation'
                }

                // Patch react-native-touch-id
                // Package name extracted from AndroidManifest.xml
                if (project.name == 'react-native-touch-id') {
                    namespace = 'com.rnfingerprint'
                }

                // Patch libraries requiring buildConfig feature flag
                // AGP 8+ requires buildFeatures.buildConfig = true when using custom BuildConfig fields
                // Multiple React Native libraries need this patch
                // Source: https://github.com/facebook/react-native/issues/40772
                if (project.name == 'react-native-image-picker') {
                    buildFeatures {
                        buildConfig = true
                    }
                }
            }
        }
    }
}

// ============================================================================
// REACT NATIVE ROOT PROJECT PLUGIN (React Native 0.87.1 template)
// ============================================================================
// Makes every library evaluate after :app (which configures their namespaces
// and JVM toolchains), sets newArchEnabled=true on every subproject, and makes
// :app:preBuild depend on every library's preBuild so all codegen output exists
// before CMake configures. Without it native builds can race codegen.
// Source: react-native-gradle-plugin 0.87.1 ReactRootProjectPlugin.kt
apply plugin: "com.facebook.react.rootproject"
