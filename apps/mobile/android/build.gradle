// TOP-LEVEL BUILD FILE - Food Waste Mobile App
// ============================================================================
// React Native 0.81.0 + Android Gradle Plugin 8.13.2
// Source: https://reactnative.dev/docs/environment-setup
//
// PROPERTY RESOLUTION PATTERN:
// ┌─────────────────────────────────────────────────────────────────────────┐
// │  gradle.properties  →  Source of Truth (Project Properties)            │
// │         ↓                                                              │
// │  ext{} block        →  Reads from properties (Backward Compatibility)  │
// │         ↓                                                              │
// │  Native modules     →  Can access via rootProject.ext.* or properties  │
// └─────────────────────────────────────────────────────────────────────────┘
//
// Why this pattern?
// - AGP 8.8+ and React Native Kotlin DSL check rootProject.properties[]
// - Legacy native modules (reanimated, maps) use rootProject.ext.*
// - This ensures both access patterns work correctly

// ============================================================================
// PNPM MONOREPO: NODE_MODULES PATH (Single Source of Truth)
// ============================================================================
// With node-linker=hoisted (.npmrc), all packages are at the workspace root.
// Define once here; reference as rootProject.ext.nodeModulesDir everywhere.
// From apps/mobile/android/ → 3 levels up to C:\WFA\node_modules
ext.nodeModulesDir = "$rootDir/../../../node_modules"

buildscript {
    ext {
        // ====================================================================
        // ANDROID SDK/NDK VERSIONS
        // ====================================================================
        // Read from gradle.properties (project properties) with hardcoded fallbacks.
        // Source of truth is gradle.properties - these fallbacks are safety nets only.
        // Source: https://developer.android.com/studio/projects/configure-agp-ndk

        // SDK Versions - React Native 0.81 requirements
        buildToolsVersion = findProperty('buildToolsVersion') ?: "35.0.0"
        minSdkVersion = findProperty('minSdkVersion')?.toInteger() ?: 24
        compileSdkVersion = findProperty('compileSdkVersion')?.toInteger() ?: 35
        targetSdkVersion = findProperty('targetSdkVersion')?.toInteger() ?: 35

        // NDK Version - Critical for native builds
        // Must be defined in gradle.properties for AGP 8.8+ compatibility
        // AGP default (27.0.12077973) differs from RN 0.81 requirement (27.1.12297006)
        ndkVersion = findProperty('ndkVersion') ?: "27.1.12297006"

        // ====================================================================
        // REACT NATIVE CONFIGURATION
        // ====================================================================
        // These are read from gradle.properties for consistency
        hermesEnabled = findProperty('hermesEnabled')?.toBoolean() ?: true
        newArchEnabled = findProperty('newArchEnabled')?.toBoolean() ?: false

        // ====================================================================
        // DEPENDENCY VERSIONS
        // ====================================================================
        // Kotlin and Firebase versions for native module compilation
        kotlinVersion = findProperty('kotlinVersion') ?: "2.0.21"
        googleServicesVersion = "4.4.2"
        firebaseBomVersion = "33.7.0"
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // Android Gradle Plugin 8.13.2
        // Source: https://developer.android.com/build/releases/gradle-plugin
        // Note: AGP 8.8+ defaults to NDK 27.0.12077973, override via gradle.properties
        classpath('com.android.tools.build:gradle:8.13.2')

        // Google Services plugin for Firebase
        classpath("com.google.gms:google-services:$googleServicesVersion")

        // Firebase Crashlytics Gradle plugin - generates build ID for crash reporting
        // Source: https://firebase.google.com/docs/crashlytics/get-started?platform=android
        // Version 3.0.6 requires AGP 8.1+ and Java 17 (both satisfied)
        classpath("com.google.firebase:firebase-crashlytics-gradle:3.0.6")

        // Kotlin plugin - version from gradle.properties via ext.kotlinVersion
        // Source: https://kotlinlang.org/docs/gradle.html
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath("com.facebook.react:react-native-gradle-plugin")
        // Note: React Native Gradle Plugin is loaded via includeBuild() in settings.gradle
        // It's applied in app/build.gradle using: plugins { id("com.facebook.react") }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()

        // JSC (JavaScriptCore) repository - not used, Hermes enabled
        // Kept for reference if JSC needed in future
        maven {
            url("${rootProject.ext.nodeModulesDir}/jsc-android/dist")
        }

        // React Native local Maven repository
        // Required for libraries that use com.facebook.react:react-native:+ dependency
        // Source: https://reactnative.dev/docs/integration-with-existing-apps
        maven {
            url("${rootProject.ext.nodeModulesDir}/react-native/android")
        }
    }

    // Force React Native version for libraries using com.facebook.react:react-native:+
    // Required for jail-monkey and other libraries that don't specify exact versions
    // Source: https://stackoverflow.com/questions/74430295
    configurations.all {
        resolutionStrategy {
            force("com.facebook.react:react-android:0.81.0")
            force("com.facebook.react:hermes-android:0.81.0")

            // Force AndroidX Core 1.13.1 - compatible with AGP 8.5.2
            // Version 1.16.0+ requires AGP 8.6.0+ which has Windows stability issues
            // Source: https://developer.android.com/jetpack/androidx/releases/core
            force("androidx.core:core:1.13.1")
            force("androidx.core:core-ktx:1.13.1")

            // Force Google Play Services versions for compatibility
            // Firebase BOM 33.7.0 requires GMS 18.5.0+ / 21.3.0+
            // react-native-geolocation-service 5.3.1 compatible with GMS 21.3.0
            // react-native-maps 1.15.6 (stable with RN 0.81.0) uses GMS Maps 18.0.x
            // Source: https://firebase.google.com/support/release-notes/android
            force("com.google.android.gms:play-services-base:18.5.0")
            force("com.google.android.gms:play-services-location:21.3.0")
            force("com.google.android.gms:play-services-maps:19.0.0")
            force("com.google.android.gms:play-services-basement:18.4.0")
            force("com.google.android.gms:play-services-tasks:18.2.0")

            // Substitute old react-native artifact with react-android for React Native 0.81+
            // Libraries like jail-monkey use com.facebook.react:react-native:+ which no longer exists
            // Source: React Native 0.70+ migration guide
            dependencySubstitution {
                substitute(module("com.facebook.react:react-native"))
                    .using(module("com.facebook.react:react-android:0.81.0"))
                    .because("React Native 0.70+ renamed react-native to react-android")
            }
        }

        // Exclude deprecated Firebase Instance ID (firebase-iid)
        // Deprecated in Firebase BOM 28+, removed in BOM 30+
        // Functionality moved to firebase-messaging
        // Source: https://firebase.google.com/support/release-notes/android
        exclude group: 'com.google.firebase', module: 'firebase-iid'
    }
}

// ============================================================================
// ENTERPRISE: NEW ARCHITECTURE COMPATIBILITY PATCHES
// ============================================================================
// React Native 0.81+ New Architecture requires special handling for legacy libraries.
// Many libraries try to apply 'com.facebook.react' plugin when newArchEnabled=true,
// but this plugin is only available via includeBuild() for the app module.
//
// Solution: Disable newArchEnabled for problematic libraries - RN 0.81's autolinking
// handles codegen through codegenConfig in package.json, not manual plugin application.
//
// Source: https://reactnative.dev/docs/new-architecture-intro
// Source: https://github.com/facebook/react-native/issues/53926

// Libraries that manually apply com.facebook.react plugin (incompatible with RN 0.81)
// NOTE: @react-native-async-storage/async-storage v2.2.0+ supports New Architecture
// as a pure Java TurboModule - no longer needs to be in this list
def newArchIncompatibleLibraries = [
    // Add problematic libraries here as discovered
]

// Apply patches to incompatible libraries before their build.gradle is evaluated
gradle.beforeProject { project ->
    if (newArchIncompatibleLibraries.contains(project.name)) {
        // Set property BEFORE any build.gradle is evaluated
        // This overrides gradle.properties value for this specific project
        project.ext.set('newArchEnabled', 'false')
        logger.lifecycle("[New Arch Patch] Disabled newArchEnabled for ${project.name}")
    }
}

// ============================================================================
// ENTERPRISE: AGP 8+ NAMESPACE & SDK COMPATIBILITY PATCHES
// ============================================================================
// AGP 8.0+ requires all Android modules to declare namespace in build.gradle
// Many legacy React Native libraries still use package attribute in AndroidManifest.xml
// This block patches those libraries at configuration time
// Source: https://developer.android.com/r/tools/upgrade-assistant/set-namespace
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                // ================================================================
                // FORCE compileSdk FOR LIBRARIES THAT DON'T PROPERLY READ ext{}
                // ================================================================
                // Some libraries fail to read rootProject.ext.compileSdkVersion
                // Force compileSdk to ensure all modules compile correctly
                // Note: android.compileSdkVersion returns String like "android-35", extract the number
                def currentSdk = android.compileSdkVersion?.toString()?.replaceAll(/[^0-9]/, '')?.toInteger() ?: 0
                def targetSdk = rootProject.ext.compileSdkVersion
                if (currentSdk < targetSdk) {
                    compileSdk targetSdk
                    logger.info("[SDK Patch] Forced compileSdk=${targetSdk} for ${project.name}")
                }

                // ================================================================
                // FORCE ndkVersion FOR ALL NATIVE MODULES (CXX5106 fix)
                // ================================================================
                // AGP 8.8+ deprecated ndk.dir in local.properties
                // Must set android.ndkVersion in all modules with native code
                // Source: https://developer.android.com/r/studio-ui/ndk-dir
                ndkVersion rootProject.ext.ndkVersion

                // Patch react-native-geolocation-service
                // Package name extracted from AndroidManifest.xml
                if (project.name == 'react-native-geolocation-service') {
                    namespace = 'com.agontuk.RNFusedLocation'
                }

                // Patch react-native-touch-id
                // Package name extracted from AndroidManifest.xml
                if (project.name == 'react-native-touch-id') {
                    namespace = 'com.rnfingerprint'
                }

                // Patch libraries requiring buildConfig feature flag
                // AGP 8+ requires buildFeatures.buildConfig = true when using custom BuildConfig fields
                // Multiple React Native libraries need this patch
                // Source: https://github.com/facebook/react-native/issues/40772
                if (project.name == 'react-native-image-picker') {
                    buildFeatures {
                        buildConfig = true
                    }
                }
            }
        }
    }
}
