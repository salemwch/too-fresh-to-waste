# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# Gradle Performance Settings
# Optimized for React Native 0.81 Android builds
# Source: https://docs.gradle.org/current/userguide/performance.html

# Enable Gradle Daemon for faster builds (issue was JDK 21, not daemon)
org.gradle.daemon=true

# Enable parallel execution for multi-module builds
# Safe with JDK 17 (JDK 21 daemon crash is avoided via org.gradle.java.home)
# Source: https://docs.gradle.org/current/userguide/performance.html#parallel_execution
org.gradle.parallel=true

# Force Gradle to use JDK 17 instead of Android Studio's JDK 21
# JDK 21 causes daemon crashes with AGP 8.x on Windows
# Source: https://issuetracker.google.com/issues/336842920
org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-17.0.16.8-hotspot

# Configure Gradle JVM memory
# Optimized for React Native 0.81 to prevent daemon crashes
# Source: GitHub Issue #19750 - MaxMetaspaceSize must be set when increasing memory
# Source: https://docs.gradle.org/current/userguide/gradle_daemon.html
org.gradle.jvmargs=-Xmx4096m -Xms256m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC

# Configuration cache DISABLED for React Native 0.81 compatibility
# Causes daemon crashes with native modules
org.gradle.configuration-cache=false
org.gradle.configuration-cache.problems=warn

# Enable build caching
org.gradle.caching=true

# Limit parallel workers for stability
org.gradle.workers.max=4

# ============================================================================
# ANDROID SDK/NDK VERSIONS (Source of Truth)
# ============================================================================
# These project properties are read by AGP, React Native Kotlin DSL, and native modules.
# Defining here ensures all build systems see the same versions.
# Source: https://developer.android.com/studio/projects/configure-agp-ndk
#
# Why here and not just ext{}?
# - AGP 8.8+ checks rootProject.properties["ndkVersion"], not ext properties
# - React Native 0.71+ Kotlin DSL uses rootProject.properties["ndkVersion"]
# - Project properties can be overridden via CLI: ./gradlew -PndkVersion=x.x.x
#
# The ext{} block in build.gradle reads these values for backward compatibility
# with legacy native modules that use rootProject.ext.ndkVersion

# Android SDK versions - React Native 0.81 requirements
# Source: https://github.com/facebook/react-native/blob/0.81-stable/packages/react-native/template/android/build.gradle
compileSdkVersion=35
targetSdkVersion=35
minSdkVersion=24
buildToolsVersion=35.0.0

# NDK version - Must match React Native 0.81 requirements
# Source: https://github.com/facebook/react-native/blob/0.81-stable/packages/react-native/gradle/libs.versions.toml
# AGP 8.8+ default is 27.0.12077973, but RN 0.81 requires 27.1.12297006
ndkVersion=27.1.12297006

# Kotlin version - Aligned with React Native 0.81 template
# Source: https://kotlinlang.org/docs/releases.html
kotlinVersion=2.0.21

# ============================================================================
# ANDROID BUILD SETTINGS
# ============================================================================
# Source: https://developer.android.com/studio/build#properties-files

# Use AndroidX libraries
android.useAndroidX=true
android.suppressUnsupportedCompileSdk=35

# Disable Jetifier - not needed for modern AndroidX-native dependencies
android.enableJetifier=false

# Enable R8 full mode for better code optimization
android.enableR8.fullMode=true

# ============================================================================
# REACT NATIVE CONFIGURATION
# ============================================================================
# Source: https://reactnative.dev/docs/hermes

# Enable Hermes JavaScript engine
# React Native 0.81 removed built-in JSC - must use Hermes or community JSC package
hermesEnabled=true

# Enable ProGuard for release builds
enableProguardInReleaseBuilds=true

# Enable New Architecture (Fabric + TurboModules)
# React Native 0.81+ has stable New Architecture support
# All native modules upgraded to New Architecture-compatible versions
# Source: https://reactnative.dev/docs/new-architecture-intro
newArchEnabled=true

# React Native Architecture Targets
# Specifies which CPU architectures to compile native code for.
# Source: React Native Community Template 0.77-stable
#
# arm64-v8a  — all modern Android phones (2015+). This is what 98%+ of users have.
# armeabi-v7a — 32-bit ARM phones (pre-2015). Covers ~1-2% of Android 7+ devices.
# x86_64     — emulators / Chromebooks only. Never served by Play Store to real phones.
# x86        — old 32-bit emulators only.
#
# LOCAL DEVELOPMENT (physical device): arm64-v8a only.
#   - ~4x faster builds (one ABI instead of four)
#   - APK drops from ~200 MB to ~50 MB
#   - Switch to x86_64 if you only test on emulator
#
# PRODUCTION (Play Store AAB — recommended):
#   ./gradlew bundleProductionRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
#   The store delivers only the matching ABI to each device automatically.
#
# PRODUCTION (direct APK with ABI splits — see app/build.gradle splits block):
#   ./gradlew assembleProductionRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
#   Generates app-arm64-v8a-release.apk + app-armeabi-v7a-release.apk (~50 MB each).
#
# x86 / x86_64 intentionally removed: Play Store never serves these to real devices.
reactNativeArchitectures=arm64-v8a

# Network timeout configuration for slow connections
# Increased timeouts for enterprise environments
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
