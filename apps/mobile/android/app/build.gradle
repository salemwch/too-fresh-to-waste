plugins {
    id("com.facebook.react")
}

apply plugin: "com.android.application"
apply plugin: "com.google.gms.google-services"
// Firebase Crashlytics removed — using Sentry for crash reporting
apply plugin: "kotlin-android"

// React Native Config - MUST be applied AFTER react plugins
// Loads environment variables from .env file at build time
// Map product flavors to their .env files (resolved by dotenv.gradle)
// Source: https://github.com/lugg/react-native-config#different-environments
project.ext.envConfigFiles = [
    dev:        ".env.development",
    staging:    ".env.staging",
    production: ".env.production",
]
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

/*
 * Fail the build when a release env file still holds a placeholder.
 *
 * A production AAB shipped with STORAGE_ENCRYPTION_KEY=REPLACE_WITH_... The app
 * refuses to start without a real key (src/storage/encryptionKey.ts), so it threw
 * on the JS thread before the runtime was ready: white screen, then the process
 * aborted. Nothing catches that - there is no JS runtime left to show an error -
 * so the first sign of it was a crash on a real device from the Play Store.
 *
 * These values are only read at build time, so this is checkable at build time.
 * Release variants only: dev and staging deliberately carry placeholder-ish keys
 * and must stay buildable offline.
 */
def PLACEHOLDER_PREFIX = "REPLACE_WITH"

// Keys that must hold a real value in a release build. STORAGE_ENCRYPTION_KEY is
// the one that hard-crashes; the rest are checked because a placeholder shipped to
// users is a bug regardless of whether it happens to throw.
def REQUIRED_RELEASE_KEYS = [
    "STORAGE_ENCRYPTION_KEY",
    "API_BASE_URL",
    "FIREBASE_API_KEY",
    "FIREBASE_APP_ID",
    "FIREBASE_MESSAGING_SENDER_ID",
]

ext.validateEnvFile = { String envFileName ->
    def envFile = file("${rootProject.projectDir}/../${envFileName}")

    if (!envFile.exists()) {
        throw new GradleException(
            "Release build requires ${envFileName}, which does not exist at ${envFile.absolutePath}.\n" +
            "It is gitignored, so a fresh clone or a CI runner will not have it. Copy it from a\n" +
            "secure store, or generate one from .env.example."
        )
    }

    def values = [:]
    envFile.eachLine { line ->
        def trimmed = line.trim()
        if (trimmed.isEmpty() || trimmed.startsWith("#")) return
        def idx = trimmed.indexOf("=")
        if (idx > 0) {
            values[trimmed.substring(0, idx).trim()] = trimmed.substring(idx + 1).trim()
        }
    }

    def problems = []
    REQUIRED_RELEASE_KEYS.each { key ->
        def value = values[key]
        if (value == null || value.isEmpty()) {
            problems << "  ${key} is missing or empty"
        } else if (value.startsWith(PLACEHOLDER_PREFIX)) {
            problems << "  ${key} is still a placeholder (${value})"
        }
    }

    if (!problems.isEmpty()) {
        throw new GradleException(
            "${envFileName} is not ready for a release build:\n" +
            problems.join("\n") + "\n\n" +
            "Fill these in before building. STORAGE_ENCRYPTION_KEY must be a real secret -\n" +
            "generate one with:  node -e \"console.log(require('crypto').randomBytes(32).toString('hex'))\"\n" +
            "Never regenerate it once users have installed the app: MMKV cannot decrypt an\n" +
            "existing store with a different key."
        )
    }
}

// Hook into release variants only, once the variant graph is known.
android.applicationVariants.all { variant ->
    if (variant.buildType.name != "release") return
    def envFileName = project.ext.envConfigFiles[variant.flavorName]
    if (envFileName == null) return

    variant.preBuildProvider.configure {
        doFirst { validateEnvFile(envFileName) }
    }
}

// React Native plugin applied above via plugins{} DSL
// Generates PackageList class for autolinking and BuildConfig constants

android {
    namespace "com.toofreshtowaste.app"
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        applicationId "com.toofreshtowaste.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Read from CI/CD env vars so each release can set VERSION_CODE/VERSION_NAME
        // without touching source. Defaults to 1 / "1.0.0" for local builds.
        // GitHub Actions example:
        //   env:
        //     VERSION_CODE: ${{ github.run_number }}
        //     VERSION_NAME: "1.0.0"
        versionCode = (System.getenv("VERSION_CODE") ?: "1").toInteger()
        versionName = System.getenv("VERSION_NAME") ?: "1.0.0"

        // Enable MultiDex for large app
        multiDexEnabled true

        // Only bundle language resources for supported locales (en, fr, ar).
        // Strips 80+ unused language string tables from Firebase, GMS, AndroidX.
        resConfigs "en", "fr", "ar"

        // Default manifest placeholders (overridden by flavors/buildTypes)
        manifestPlaceholders = [
            usesCleartextTraffic: "false"
        ]
    }

    // ============================================================================
    // ENTERPRISE: PRODUCT FLAVORS FOR MULTI-ENVIRONMENT DEPLOYMENT
    // ============================================================================
    // Source: https://developer.android.com/build/build-variants
    //
    // Build variants generated:
    //   devDebug, devRelease, stagingDebug, stagingRelease,
    //   productionDebug, productionRelease
    //
    // Build commands:
    //   Development:  ./gradlew assembleDevDebug
    //   Staging:      ./gradlew assembleStagingRelease
    //   Production:   ./gradlew bundleProductionRelease (AAB for Play Store)
    //
    // Each flavor loads its own .env file via react-native-config (see envConfigFiles above).
    // Firebase: place per-flavor google-services.json in app/src/<flavor>/.
    //   Dev/Staging need their package names registered in Firebase Console.
    //   Fallback: app/google-services.json is used if no per-flavor file exists.
    flavorDimensions "environment"

    productFlavors {
        /*
         * `build_config_package` is required on any flavor that sets an
         * applicationIdSuffix.
         *
         * react-native-config locates BuildConfig by the *runtime* package
         * name. The suffix makes that `com.toofreshtowaste.app.dev`, while
         * BuildConfig is generated into `com.toofreshtowaste.app` (the
         * applicationId, unsuffixed). The reflective lookup missed, the native
         * module returned an empty config, and every `Config[...]` read in JS
         * fell through to the hardcoded fallback in `src/config/environment.ts`
         * - so dev and staging builds silently ignored their .env files and ran
         * against `http://localhost:3000` with placeholder Firebase, Maps and
         * storage-encryption values.
         *
         * Found 2026-08-29 while pointing the dev build at a local mock API:
         * BuildConfig.java held the right API_BASE_URL and the app still read
         * the default. Production was never affected - it sets no suffix, so
         * its package already matched.
         *
         * Source: https://github.com/lugg/react-native-config#problems-with-devrelease-builds
         */
        dev {
            dimension "environment"
            applicationIdSuffix ".dev"
            resValue "string", "app_name", "TFTW Dev"
            resValue "string", "build_config_package", "com.toofreshtowaste.app"
        }
        staging {
            dimension "environment"
            applicationIdSuffix ".staging"
            resValue "string", "app_name", "TFTW Staging"
            resValue "string", "build_config_package", "com.toofreshtowaste.app"
        }
        production {
            dimension "environment"
            resValue "string", "app_name", "Too Fresh To Waste"
        }
    }

    // ============================================================================
    // ENTERPRISE: SIGNING CONFIGURATIONS
    // ============================================================================
    signingConfigs {
        // Debug signing - standard Android debug keystore
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        // Release signing — two paths (priority order):
        //
        // 1. LOCAL: android/keystore.properties (gitignored, never committed)
        //    Copy android/keystore.properties.example → android/keystore.properties
        //    and fill in your values.
        //
        // 2. CI/CD: Fastlane injects signing via android.injected.signing.* Gradle
        //    properties (see fastlane/Fastfile). If running Gradle directly in CI,
        //    set KEYSTORE_PATH, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD env vars.
        //
        // Source: https://developer.android.com/studio/publish/app-signing
        release {
            def propsFile = rootProject.file("keystore.properties")
            if (propsFile.exists()) {
                def props = new Properties()
                props.load(new FileInputStream(propsFile))
                storeFile     file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias      props['keyAlias']
                keyPassword   props['keyPassword']
            } else {
                // CI fallback: direct Gradle invocation (not via Fastlane)
                def keystorePath = System.getenv("KEYSTORE_PATH") ?: System.getenv("KEYSTORE_FILE")
                if (keystorePath) {
                    storeFile     file(keystorePath)
                    storePassword System.getenv("KEYSTORE_PASSWORD")
                    keyAlias      System.getenv("KEY_ALIAS")
                    keyPassword   System.getenv("KEY_PASSWORD")
                } else {
                    logger.warn("⚠️  WARNING: Release signing not configured. Copy android/keystore.properties.example → android/keystore.properties and fill in your keystore details.")
                }
            }
        }
    }

    // ============================================================================
    // ENTERPRISE: BUILD TYPES
    // ============================================================================
    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
            debuggable = true
            minifyEnabled = false
            shrinkResources = false

            // Debug builds allow cleartext traffic for development
            manifestPlaceholders = [
                usesCleartextTraffic: "true"
            ]
        }

        release {
            // Use release signing configuration (from environment variables)
            signingConfig = signingConfigs.release
            debuggable = false

            // Enable ProGuard/R8 minification and obfuscation
            // Source: https://developer.android.com/studio/build/shrink-code
            minifyEnabled = (findProperty('enableProguardInReleaseBuilds') ?: 'true').toBoolean()
            shrinkResources = true
            crunchPngs = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"

            // Release builds enforce secure connections (no cleartext)
            manifestPlaceholders = [
                usesCleartextTraffic: "false"
            ]
        }
    }

    // ============================================================================
    // ABI SPLITS — RELEASE BUILDS
    // ============================================================================
    // Produces one lean APK per architecture instead of one fat universal APK.
    // Only applies when -PreactNativeArchitectures includes multiple ABIs (release CI).
    // For Play Store, prefer AAB (bundleProductionRelease) over APK splits — the
    // store handles per-device delivery automatically without needing this block.
    // Source: https://developer.android.com/build/configure-apk-splits
    splits {
        abi {
            reset()
            // Enable only when the Gradle invocation targets a release task
            enable gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') && !it.toLowerCase().contains('bundle') }
            universalApk false          // no fat APK — each device gets only its ABI
            // Derived from -PreactNativeArchitectures (falling back to the
            // gradle.properties value) so the split filter can never disagree with
            // the ABIs that were actually compiled. This list used to be hardcoded
            // to arm64-v8a/armeabi-v7a, so building for an emulator
            // (-PreactNativeArchitectures=x86_64) filtered every APK down to an ABI
            // whose .so files had never been built — an unrunnable release APK,
            // with no error to say why.
            include(*((project.findProperty('reactNativeArchitectures') ?: 'arm64-v8a,armeabi-v7a')
                .split(',')
                .collect { it.trim() }
                .findAll { it } as String[]))
        }
    }

    // ============================================================================
    // JAVA COMPATIBILITY
    // ============================================================================
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        
    }
     kotlinOptions {
        jvmTarget = '17'
    }
}
kotlin {
    jvmToolchain(17)
}

// ============================================================================
// REACT NATIVE: AUTOLINKING CONFIGURATION
// ============================================================================
// Source: React Native 0.81 template
// https://github.com/react-native-community/template/blob/0.81-stable/template/android/app/build.gradle
//
// Automatically links native dependencies discovered by autolinking
// Adds implementation project(':module-name') dependencies for all React Native modules
react {
    // Paths derived from centralized nodeModulesDir (defined in root build.gradle).
    // Required for pnpm node-linker=hoisted monorepo where all packages are at
    // the workspace root node_modules/, not apps/mobile/node_modules/.
    reactNativeDir = file("${rootProject.ext.nodeModulesDir}/react-native")
    codegenDir = file("${rootProject.ext.nodeModulesDir}/@react-native/codegen")
    // Explicit hermesc path — Gradle plugin can't resolve %OS-BIN% in pnpm monorepo
    hermesCommand = "${rootProject.ext.nodeModulesDir}/react-native/sdks/hermesc/win64-bin/hermesc.exe"
    autolinkLibrariesWithApp()
}

// ============================================================================
// REACT NATIVE VECTOR ICONS (SCOPED PACKAGES)
// ============================================================================
// Migrated to @react-native-vector-icons/* scoped packages (v12.x)
// Font bundling is handled automatically via React Native auto-linking.
// No manual vectorIconsFonts configuration required.

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])

    // React Native core dependencies - Explicit versions for monorepo setup
    // Autolinking handles native modules, but core RN deps are explicit
    // Source: React Native 0.81 requirements
    implementation("com.facebook.react:react-android:0.81.0")
    implementation("com.facebook.react:hermes-android:0.81.0")

    // Nitro-based libraries require manual linking because CMake autolinking is disabled
    // Their Java/Kotlin code is autolinked, but we need explicit project dependencies
    // Source: https://nitro.margelo.com/docs/minimum-requirements
    implementation project(":react-native-nitro-modules")
    implementation project(":react-native-mmkv")

    // Firebase BOM - manages all Firebase dependency versions
    // Source: https://firebase.google.com/docs/android/setup
    implementation platform("com.google.firebase:firebase-bom:${rootProject.ext.firebaseBomVersion}")
    implementation "com.google.firebase:firebase-messaging"

    // AndroidX Core - version 1.13.1 is compatible with AGP 8.7.3 and compileSdk 36
    // Source: https://developer.android.com/jetpack/androidx/releases/core
    implementation 'androidx.core:core-ktx:1.13.1'

    // AndroidX Activity 1.10.1 — fixes deprecated edge-to-edge APIs on Android 15 (API 35)
    // Older versions (1.8.x) call setStatusBarColor/setNavigationBarColor which are deprecated.
    // 1.10.0+ uses the non-deprecated WindowInsetsController path.
    // Source: https://developer.android.com/jetpack/androidx/releases/activity
    implementation 'androidx.activity:activity-ktx:1.10.1'

    // Google Play Services Location - Required by react-native-geolocation-service
    // Version forced in root build.gradle to 21.3.0 for Firebase BOM 33.7.0 compatibility
    // Source: https://developers.google.com/android/guides/setup
    implementation 'com.google.android.gms:play-services-location:21.4.0'

}

// ============================================================================
// FIX: Metro generates both .webp and .png for the same image asset, causing
// "Duplicate resources" errors during mergeReleaseResources. Remove the .png
// duplicate whenever a .webp with the same name exists in the same directory.
// Source: https://github.com/facebook/react-native/issues/35generators
// ============================================================================
afterEvaluate {
    android.applicationVariants.configureEach { variant ->
        def capitalizedName = variant.name.capitalize()
        def bundleTask = tasks.findByName("createBundle${capitalizedName}JsAndAssets")
        def mergeTask = tasks.findByName("merge${capitalizedName}Resources")

        if (bundleTask != null && mergeTask != null) {
            def dedup = tasks.register("dedup${capitalizedName}WebpAssets") {
                doLast {
                    def resDir = file("${buildDir}/generated/res/react/${variant.name}")
                    if (resDir.exists()) {
                        resDir.eachFileRecurse { f ->
                            if (f.name.endsWith('.webp')) {
                                def png = new File(f.parentFile, f.name.replace('.webp', '.png'))
                                if (png.exists()) {
                                    png.delete()
                                    logger.lifecycle("[Dedup] Removed ${png.name} (keeping ${f.name})")
                                }
                            }
                        }
                    }
                }
            }
            dedup.configure { dependsOn bundleTask }
            mergeTask.dependsOn dedup
        }
    }
}

// ============================================================================
// FIX: React Native Gradle Plugin Overlapping Outputs (Gradle Official Fix)
// ============================================================================
// Issue: Tasks :app:generateReactNativeEntryPoint and :app:generateAutolinkingPackageList
//        both write to: build/generated/autolinking/src/main/java/
// Impact: Gradle automatically disables caching for overlapping outputs
// Solution: Separate output directories per Gradle official guidance
// Source: https://docs.gradle.org/current/userguide/build_cache_concepts.html#concepts_overlapping_outputs
// TODO: Remove when React Native Gradle Plugin fixes this upstream

afterEvaluate {
    tasks.matching { it.name == 'generateReactNativeEntryPoint' }.configureEach { task ->
        // Assign unique output directory to enable Gradle build cache
        def separateOutputDir = layout.buildDirectory.dir("generated/rn-entry-point/src/main/java")
        task.outputs.dir(separateOutputDir)

        // Register new output directory with Android source sets
        android.sourceSets.main.java.srcDirs += separateOutputDir.get().asFile

        logger.lifecycle("[Gradle Fix] Separated ReactNativeEntryPoint output to enable caching: ${separateOutputDir.get().asFile}")
    }
}

// Apply Google Services plugin at the end
// Source: https://firebase.google.com/docs/android/setup#add-config-file
