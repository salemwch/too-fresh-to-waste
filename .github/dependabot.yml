version: 2

updates:
  # ── Root workspace (turbo, husky, lint-staged, etc.) ──────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Tunis
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns:
          - "turbo"
          - "husky"
          - "lint-staged"
          - "typescript"
          - "@typescript-eslint/*"
          - "eslint*"
          - "prettier"
    ignore:
      # Major version bumps require manual review
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ── Backend (NestJS) ───────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /apps/food-waste-backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Tunis
    open-pull-requests-limit: 10
    groups:
      nestjs-core:
        patterns:
          - "@nestjs/*"
      security-deps:
        # These get individual PRs (no grouping) so changes are auditable
        patterns:
          - "helmet"
          - "bcrypt"
          - "jsonwebtoken"
          - "passport*"
          - "class-validator"
          - "class-transformer"
    labels:
      - "dependencies"
      - "backend"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ── Web (Next.js) ──────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Tunis
    open-pull-requests-limit: 5
    groups:
      next-ecosystem:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react*"
      tanstack:
        patterns:
          - "@tanstack/*"
    labels:
      - "dependencies"
      - "web"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ── Mobile (React Native) ─────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Tunis
    open-pull-requests-limit: 5
    groups:
      react-native-core:
        patterns:
          - "react-native"
          - "@react-native/*"
          - "@react-navigation/*"
      redux-ecosystem:
        patterns:
          - "@reduxjs/*"
          - "redux*"
    labels:
      - "dependencies"
      - "mobile"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ── Android native (Gradle) ────────────────────────────────────────────────
  # Added 2026-09-10. Every entry above is `npm`, and `pnpm audit` runs in CI on
  # top of them, so the JavaScript tree had two independent watchers. Nothing
  # watched the Android/Gradle tree at all — which is precisely where the
  # io.netty and kotlin-stdlib advisories surfaced, and the half that Snyk OSS
  # could no longer re-scan once its quota ran out. A single scanner with a
  # monthly cap was the only coverage for the native dependencies.
  - package-ecosystem: gradle
    directory: /apps/mobile/android
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Tunis
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "mobile"
    ignore:
      # Major bumps stay manual, as in every other entry here. Kotlin needs that
      # doubly: gradle.properties:kotlinVersion drives the compiler plugin as
      # well as the stdlib, so the two must move together or not at all.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ── Shared packages ────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /packages/shared
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Tunis
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "shared"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /packages/ui
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Tunis
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "shared"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ── Docker (backend image) ─────────────────────────────────────────────────
  - package-ecosystem: docker
    directory: /apps/food-waste-backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Tunis
    labels:
      - "dependencies"
      - "docker"
      - "security"

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Tunis
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci-cd"
