name: Secret Rotation Check

# Run weekly to check if secrets need rotation
on:
  schedule:
    - cron: "0 0 * * 1" # Every Monday at midnight
  workflow_dispatch: # Allow manual trigger

jobs:
  check-secret-age:
    name: Check Secret Age
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for git log analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Check secret age
        id: check
        run: |
          chmod +x scripts/check-secret-age.js
          node scripts/check-secret-age.js || echo "rotation_needed=true" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: secret-age-report
          path: reports/secret-age-report.json

      - name: Create issue if rotation needed
        if: steps.check.outputs.rotation_needed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔐 Secret Rotation Required',
              body: `## Secret Rotation Alert

            One or more secrets have exceeded their rotation policy and require immediate attention.

            ### Action Required
            1. Review the [secret age report](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            2. Run the rotation script: \`./scripts/rotate-secrets.sh all\`
            3. Update this issue with rotation completion date

            ### Resources
            - [Secrets Rotation Guide](../blob/main/SECRETS_ROTATION_GUIDE.md)
            - [DevOps Deployment Guide](../blob/main/DEVOPS_DEPLOYMENT_GUIDE.md)

            **Priority:** HIGH
            **Due Date:** Within 7 days

            /cc @security-team`,
              labels: ['security', 'high-priority', 'secret-rotation']
            })

      - name: Notify on Slack (optional)
        if: steps.check.outputs.rotation_needed == 'true'
        run: |
          echo "Secret rotation required - send Slack notification"
          # Add Slack webhook integration here
          # curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          #   -H 'Content-Type: application/json' \
          #   -d '{"text":"🔐 Secret rotation required for FoodWaste Backend"}'
