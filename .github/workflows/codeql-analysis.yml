name: CodeQL Security Analysis

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    # Full scan every Sunday at 02:00 UTC — catches new CVEs even without code changes
    - cron: "0 2 * * 0"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
        # Add 'python' or 'go' here if you add services in those languages

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.11.1"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.17.0"

      # Build the project so CodeQL can trace compiled output —
      # improves accuracy of data-flow queries (injection, auth bypass, etc.)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @foodwaste/shared build

      # Initialize CodeQL with extended security-and-quality suite.
      # 'security-extended' covers OWASP Top 10, injection, XSS, path traversal,
      # insecure crypto, hardcoded credentials, and more.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          # Exclude generated files, node_modules, and test fixtures
          config: |
            paths-ignore:
              - node_modules
              - '**/node_modules'
              - '**/dist'
              - '**/.turbo'
              - '**/coverage'
              - '**/__mocks__'
              - '**/*.spec.ts'
              - '**/*.test.ts'
              - '**/jest.config.*'
              - 'packages/shared/src/generated'

      - name: Build for CodeQL tracing
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
          # Upload results to GitHub Security tab (requires security-events: write)
          upload: true

  # ── Semgrep OSS — fast, rule-based SAST as a second opinion ───────────────
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only run on PRs to avoid noise on every push — CodeQL covers scheduled runs
    if: github.event_name == 'pull_request'

    container:
      image: semgrep/semgrep:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The custom rules encode confirmed findings from the backend security
      # audit, each with a fixture proving what it does and does not match.
      # Verify the rules themselves before trusting their verdict on the code.
      - name: Verify custom rules against their fixtures
        run: semgrep --test --config .semgrep/wfa-security.yml .semgrep/tests/

      # BLOCKING. These are our own curated rules — every hit is a real
      # regression of something already fixed, so there is nothing to triage.
      - name: Run WFA custom security rules
        run: |
          semgrep scan \
            --config .semgrep/wfa-security.yml \
            --error \
            --metrics=off \
            --exclude node_modules \
            --exclude dist \
            --exclude coverage \
            --exclude .semgrep/tests

      # ADVISORY. Broad third-party rulesets — valuable but noisy, so they
      # report to the Security tab rather than blocking the PR.
      - name: Run Semgrep community rulesets
        run: |
          semgrep ci \
            --config p/typescript \
            --config p/nodejs \
            --config p/nestjs \
            --config p/jwt \
            --config p/react \
            --config p/owasp-top-ten \
            --sarif \
            --output semgrep-results.sarif \
            --exclude node_modules \
            --exclude dist \
            --exclude coverage \
            --exclude '**/*.spec.ts' \
            --exclude '**/*.test.ts'
        env:
          # Optional: set SEMGREP_APP_TOKEN secret for Semgrep Cloud dashboard
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true # Advisory only — see the blocking step above

      - name: Upload Semgrep results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep
