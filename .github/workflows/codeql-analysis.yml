name: CodeQL Security Analysis

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    # Full scan every Sunday at 02:00 UTC — catches new CVEs even without code changes
    - cron: "0 2 * * 0"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
        # Add 'python' or 'go' here if you add services in those languages

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.11.1"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.17.0"

      # Build the project so CodeQL can trace compiled output —
      # improves accuracy of data-flow queries (injection, auth bypass, etc.)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @foodwaste/shared build

      # Initialize CodeQL with extended security-and-quality suite.
      # 'security-extended' covers OWASP Top 10, injection, XSS, path traversal,
      # insecure crypto, hardcoded credentials, and more.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          # Exclude generated files, node_modules, and test fixtures
          config: |
            paths-ignore:
              - node_modules
              - '**/node_modules'
              - '**/dist'
              - '**/.turbo'
              - '**/coverage'
              - '**/__mocks__'
              - '**/*.spec.ts'
              - '**/*.test.ts'
              - '**/jest.config.*'
              - 'packages/shared/src/generated'

      - name: Build for CodeQL tracing
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
          # Upload results to GitHub Security tab (requires security-events: write)
          upload: true

  # ── Semgrep OSS — fast, rule-based SAST as a second opinion ───────────────
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs on push and pull_request both (the workflow's `on:` triggers), so
    # master is covered rather than only the PR that targets it.
    #
    # This was `if: github.event_name == 'pull_request'`, on the reasoning that
    # CodeQL covered scheduled runs. It does not cover these rules: the custom
    # rulesets here encode confirmed findings from the backend audit and have
    # no CodeQL equivalent, so anything merged outside a PR — a direct push, an
    # admin merge, a hotfix — was never checked against them.
    #
    # Make this job a required status check in branch protection; the workflow
    # file cannot enforce that on its own.

    container:
      image: semgrep/semgrep:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The custom rules encode confirmed findings from the backend security
      # audit, each with a fixture proving what it does and does not match.
      # Verify the rules themselves before trusting their verdict on the code.
      - name: Verify custom rules against their fixtures
        run: semgrep --test --config .semgrep/wfa-security.yml .semgrep/wfa-security.ts

      # BLOCKING, but only at ERROR. Those rules guard defects that are already
      # fixed, so any hit is a regression with nothing to triage. WARNING rules
      # (currently the fail-open ownership guard) describe known debt — they are
      # reported below rather than failing every PR, which is what turns a gate
      # into noise nobody reads.
      # rules.yml holds 17 project rules (token storage, hardcoded secrets,
      # cookie flags, NoSQL operators, XSS sinks). They existed only in the
      # `security:sast` npm script and were never run by CI — a rule nobody
      # runs is a rule that does not exist. Verified clean at 0 findings when
      # wired in here.
      - name: Run WFA custom security rules
        run: |
          semgrep scan \
            --config .semgrep/wfa-security.yml \
            --config .semgrep/rules.yml \
            --severity ERROR \
            --error \
            --metrics=off \
            --exclude node_modules \
            --exclude dist \
            --exclude coverage \
            --exclude .semgrep

      # Non-blocking: surfaces WARNING-level findings without failing the build.
      - name: Report WFA warning-level findings
        run: |
          semgrep scan \
            --config .semgrep/wfa-security.yml \
            --severity WARNING \
            --metrics=off \
            --exclude node_modules \
            --exclude dist \
            --exclude coverage \
            --exclude .semgrep
        continue-on-error: true

      # ADVISORY. Broad third-party rulesets — valuable but noisy, so they
      # report to the Security tab rather than blocking the PR.
      - name: Run Semgrep community rulesets
        run: |
          semgrep ci \
            --config p/typescript \
            --config p/nodejs \
            --config p/nestjs \
            --config p/jwt \
            --config p/react \
            --config p/owasp-top-ten \
            --sarif \
            --output semgrep-results.sarif \
            --exclude node_modules \
            --exclude dist \
            --exclude coverage \
            --exclude '**/*.spec.ts' \
            --exclude '**/*.test.ts'
        env:
          # Optional: set SEMGREP_APP_TOKEN secret for Semgrep Cloud dashboard
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true # Advisory only — see the blocking step above

      # The producing step is continue-on-error, so the SARIF may not exist.
      # Guard on the file rather than on `always()` alone, or a skipped
      # advisory scan turns into a red upload step and buries the real gate.
      - name: Upload Semgrep results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('semgrep-results.sarif') != ''
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep
