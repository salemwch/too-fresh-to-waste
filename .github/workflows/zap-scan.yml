name: OWASP ZAP Security Scan

# Dynamic application security testing (DAST).
#
# Triggers:
#   - Automatically after a successful backend CI/CD run on develop OR master
#   - Weekly on a schedule (baseline, regardless of deploys)
#   - Manually against any environment (workflow_dispatch)
#
# Targets (auto / scheduled runs):
#   - api  — the NestJS API   (vars.API_STAGING_URL, falls back to the staging default)
#   - web  — the Next.js app  (vars.WEB_STAGING_URL — the web leg is skipped when unset)
#
# Uses ZAP Baseline scan (passive rules only — no data modification):
#   - Spiders the target and checks all discovered endpoints
#   - Runs ~120 passive rules: missing headers, info disclosure,
#     insecure cookies, CORS misconfiguration, outdated libraries, etc.
#   - Does NOT brute-force, fuzz, or modify data (safe for staging)
#
# For full active scanning (SQL injection, XSS fuzzing, etc.) run manually
# with workflow_dispatch selecting scan_type=full — never against production.

on:
  workflow_run:
    workflows: ["Backend CI/CD Pipeline"]
    types: [completed]
    branches: [develop, master]
  schedule:
    - cron: "0 4 * * 1" # Weekly DAST baseline — Mondays 04:00 UTC
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target URL to scan (default: staging API)"
        required: false
        default: "https://api-staging.foodwaste.com"
      scan_type:
        description: "Scan type: baseline (passive) or full (active)"
        required: false
        default: "baseline"
        type: choice
        options:
          - baseline
          - full
      environment:
        description: "Environment label for the report"
        required: false
        default: "staging"

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  zap:
    name: ZAP Scan (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    # Manual runs scan the single provided URL on the api leg only. Auto and
    # scheduled runs scan the API and — when WEB_STAGING_URL is set — the web app.
    if: >
      (github.event_name == 'workflow_dispatch' && matrix.app == 'api') ||
      (github.event_name == 'schedule' &&
        (matrix.app == 'api' || vars.WEB_STAGING_URL != '')) ||
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        (matrix.app == 'api' || vars.WEB_STAGING_URL != ''))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set scan target
        id: target
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            URL="${{ github.event.inputs.target_url }}"
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "health=$URL" >> "$GITHUB_OUTPUT"
            echo "env=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
            echo "type=${{ github.event.inputs.scan_type }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.app }}" == "web" ]; then
            URL="${{ vars.WEB_STAGING_URL }}"
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "health=$URL" >> "$GITHUB_OUTPUT"
            echo "env=staging-web" >> "$GITHUB_OUTPUT"
            echo "type=baseline" >> "$GITHUB_OUTPUT"
          else
            URL="${{ vars.API_STAGING_URL || 'https://api-staging.foodwaste.com' }}"
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "health=$URL/health/liveness" >> "$GITHUB_OUTPUT"
            echo "env=staging-api" >> "$GITHUB_OUTPUT"
            echo "type=baseline" >> "$GITHUB_OUTPUT"
          fi

      # Wait for the deployment to be ready before scanning. The workflow_run
      # event fires when the CI pipeline completes, but the container may still
      # be starting up.
      - name: Wait for target to be ready
        if: github.event_name == 'workflow_run' || github.event_name == 'schedule'
        run: |
          echo "→ Waiting for ${{ steps.target.outputs.url }} to be ready..."
          timeout 120 bash -c \
            "until curl -sf '${{ steps.target.outputs.health }}' \
                --max-time 5 --silent -o /dev/null; do
              echo '   not ready yet, retrying in 5s...'
              sleep 5
            done"
          echo "✓ Target is ready"

      # ── ZAP Baseline Scan (passive — always safe) ─────────────────────────
      - name: ZAP Baseline Scan
        if: steps.target.outputs.type == 'baseline'
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ steps.target.outputs.url }}
          # Rules configuration: suppress known false-positives for NestJS APIs.
          # See: https://www.zaproxy.org/docs/alerts/
          rules_file_name: .github/zap/baseline-rules.tsv
          # Generate SARIF for the GitHub Security tab
          cmd_options: >
            -J zap-report.json
            -w zap-report.md
            -r zap-report.html
            -I
          # -I = don't fail on WARN-level findings (only FAIL-level blocks the build)
          allow_issue_writing: false

      # ── ZAP Full Scan (active — manual only, never on auto-trigger) ────────
      - name: ZAP Full Scan
        if: steps.target.outputs.type == 'full'
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: ${{ steps.target.outputs.url }}
          rules_file_name: .github/zap/baseline-rules.tsv
          cmd_options: >
            -J zap-report.json
            -w zap-report.md
            -r zap-report.html
            -I
          allow_issue_writing: false

      - name: Upload ZAP HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report-${{ steps.target.outputs.env }}-${{ github.run_id }}
          path: |
            zap-report.html
            zap-report.json
            zap-report.md
          retention-days: 30

      # Upload SARIF so findings appear in the GitHub Security → Code scanning tab
      - name: Upload ZAP SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: zap-${{ steps.target.outputs.env }}
        continue-on-error: true # SARIF file may not exist if ZAP found nothing

      # Create a GitHub issue for HIGH/CRITICAL findings on scheduled / auto runs.
      # Manual runs just show the report artifact — no issue spam.
      - name: Create issue for HIGH findings
        if: failure() && (github.event_name == 'workflow_run' || github.event_name == 'schedule')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const target = '${{ steps.target.outputs.env }}';
            let summary = 'See the [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for the full ZAP report.';

            try {
              const report = JSON.parse(fs.readFileSync('zap-report.json', 'utf8'));
              const highs = report.site?.[0]?.alerts?.filter(a => parseInt(a.riskcode) >= 2) ?? [];
              if (highs.length > 0) {
                summary = highs.slice(0, 10).map(a =>
                  `- **${a.alert}** (risk: ${a.riskdesc})\n  ${a.url ?? ''}`
                ).join('\n');
              }
            } catch (e) { /* report not parseable */ }

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔴 ZAP found HIGH/CRITICAL vulnerabilities on ${target}`,
              body: `## OWASP ZAP Security Scan — ${target}

            ZAP baseline scan detected HIGH or CRITICAL findings on ${target} after the latest deploy.

            ### Findings (top 10)
            ${summary}

            ### Resources
            - Download the [full HTML report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - [GitHub Security tab](https://github.com/${{ github.repository }}/security/code-scanning)

            **Priority:** HIGH — fix before next production deploy`,
              labels: ['security', 'high-priority', 'zap']
            })
