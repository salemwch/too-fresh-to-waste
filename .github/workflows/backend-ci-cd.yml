name: Backend CI/CD Pipeline

on:
  push:
    branches: [main, master, develop, staging]
    paths:
      - "apps/food-waste-backend/**"
      - "packages/shared/**"
      - ".github/workflows/backend-ci-cd.yml"
      - "pnpm-lock.yaml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "apps/food-waste-backend/**"
      - "packages/shared/**"

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.11.1"
  PNPM_VERSION: "10.17.0"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  # ============================================
  # Job 1 — FAST: lint + type-check + unit tests
  # Catches 90% of issues in ~2 min
  # ============================================
  fast-checks:
    name: Lint + Types + Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-backend-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-backend-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm --filter @foodwaste/backend check:ts

      - name: ESLint
        run: pnpm --filter @foodwaste/backend check:lint

      - name: Prettier
        run: pnpm --filter @foodwaste/backend check:format

      - name: Unit tests
        run: pnpm --filter @foodwaste/backend test:unit
        env:
          NODE_ENV: test

  # ============================================
  # Job 2 — SLOW: integration tests (needs DB + cache)
  # Runs after fast-checks pass
  # ============================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: fast-checks
    timeout-minutes: 20

    services:
      mongodb:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: test
          MONGO_INITDB_ROOT_PASSWORD: test
          MONGO_INITDB_DATABASE: test
        ports:
          - 27017:27017
        options: >-
          --health-cmd "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration tests with coverage
        run: pnpm --filter @foodwaste/backend test:ci
        env:
          NODE_ENV: test
          DATABASE_URL: mongodb://test:test@localhost:27017/test?authSource=admin
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          JWT_SECRET: test-jwt-secret-for-ci-only
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-for-ci-only

      # Indexes are declared on the Mongoose schemas but `autoIndex` is off in
      # production, so nothing creates them there except db:create-indexes. These
      # two steps prove, against a throwaway MongoDB, that every declared index is
      # actually creatable and that the drift detector agrees.
      #
      # This catches a class of bug that no other check can see: an index MongoDB
      # rejects outright never gets built, in any environment, silently. One had
      # been broken for months — users.address.coordinates set both `sparse` and
      # `partialFilterExpression`, which MongoDB refuses.
      - name: Create indexes from schemas
        run: pnpm --filter @foodwaste/backend db:create-indexes
        env:
          NODE_ENV: test
          DATABASE_URL: mongodb://test:test@localhost:27017/index_gate?authSource=admin

      - name: Verify no index drift
        run: pnpm --filter @foodwaste/backend verify:indexes:strict
        env:
          NODE_ENV: test
          DATABASE_URL: mongodb://test:test@localhost:27017/index_gate?authSource=admin

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./apps/food-waste-backend/coverage/coverage-final.json
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

  # ============================================
  # Job 3 — PARALLEL: security audit
  # Runs alongside integration tests
  # ============================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: fast-checks
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No --recursive: pnpm 10 has no such flag for `audit` and exits 1 with
      # "Unknown option", so this gate was failing rather than auditing. `pnpm audit`
      # at the workspace root already covers every package via the shared lockfile.
      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: Check for hardcoded secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ============================================
  # Build, Sign & Push Docker Image
  # Only after all checks pass
  # ============================================
  build:
    name: Build & Sign Docker Image
    runs-on: ubuntu-latest
    needs: [integration-tests, security]
    if: github.event_name == 'push'
    timeout-minutes: 30

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/food-waste-backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

      - name: Log image digest
        run: echo "Image digest ${{ steps.build.outputs.digest }}"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign container image (keyless OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"
          echo "✓ Signed: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

  # ============================================
  # Container Security (Trivy + SBOM)
  # ============================================
  container-security:
    name: Container Security + SBOM
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    timeout-minutes: 15

    permissions:
      contents: write
      packages: read
      id-token: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Generate Docker image SBOM (CycloneDX)
        uses: anchore/sbom-action@v0.17.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}
          format: cyclonedx-json
          output-file: sbom-docker-cyclonedx.json
          upload-artifact: true
          upload-artifact-retention: 7

      - name: Generate Docker image SBOM (SPDX)
        uses: anchore/sbom-action@v0.17.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}
          format: spdx-json
          output-file: sbom-docker-spdx.json
          upload-artifact: true
          upload-artifact-retention: 7

      - name: Generate source SBOM (CycloneDX)
        uses: anchore/sbom-action@v0.17.2
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-source-cyclonedx.json
          upload-artifact: true
          upload-artifact-retention: 7

      - name: Attest SBOM to image
        env:
          DIGEST: ${{ needs.build.outputs.image-digest }}
        run: |
          cosign attest --yes \
            --predicate sbom-docker-cyclonedx.json \
            --type cyclonedx \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"
          echo "✓ SBOM attestation attached to image"

      - name: Submit SBOM to GitHub Dependency Graph
        uses: anchore/sbom-action/publish-sbom@v0.17.2
        with:
          sbom-artifact-match: ".*cyclonedx.*"

      - name: Scan SBOM for vulnerabilities (Grype)
        id: grype
        uses: anchore/scan-action@v4.1.2
        with:
          sbom: sbom-docker-cyclonedx.json
          fail-build: false
          severity-cutoff: high
          output-format: sarif

      - name: Upload Grype results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype
        continue-on-error: true

  # ============================================
  # Deploy to Staging
  # ============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, container-security]
    if: github.ref == 'refs/heads/develop'
    timeout-minutes: 15

    environment:
      name: staging
      url: https://api-staging.foodwaste.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop-${{ github.sha }}"
            CONTAINER="foodwaste-backend-staging"
            ENV_FILE="/opt/foodwaste/staging/.env"

            echo "→ Logging into GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u ${{ github.actor }} --password-stdin

            echo "→ Pulling image: $IMAGE"
            docker pull "$IMAGE"

            echo "→ Saving previous container id for rollback (if any)..."
            PREV_CONTAINER=$(docker ps -q --filter "name=${CONTAINER}") || true

            echo "→ Starting new container..."
            docker run -d \
              --name "${CONTAINER}-new" \
              --restart unless-stopped \
              --env-file "$ENV_FILE" \
              -p 3001:3000 \
              "$IMAGE"

            echo "→ Waiting for new container to be healthy (up to 60s)..."
            timeout 60 bash -c \
              "until docker exec ${CONTAINER}-new \
                  node -e \"require('http').get('http://localhost:3000/health/liveness', r => process.exit(r.statusCode === 200 ? 0 : 1))\" \
                  2>/dev/null; do sleep 3; done"

            echo "→ New container healthy — swapping..."
            if [ -n "$PREV_CONTAINER" ]; then
              docker stop "$PREV_CONTAINER"
              docker rm  "$PREV_CONTAINER"
            fi
            docker rename "${CONTAINER}-new" "$CONTAINER"

            echo "→ Cleaning up old images (keep last 3)..."
            docker images "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" \
              --format "{{.ID}}" | tail -n +4 | xargs -r docker rmi || true

            echo "✓ Staging deployment complete"

      - name: Smoke tests
        run: |
          BASE="https://api-staging.foodwaste.com"

          echo "→ [1/3] Liveness probe..."
          curl -sf "${BASE}/health/liveness" \
            -H "Accept: application/json" \
            --max-time 10 --retry 5 --retry-delay 5 --retry-connrefused

          echo "→ [2/3] Readiness probe..."
          curl -sf "${BASE}/health/readiness" \
            -H "Accept: application/json" \
            --max-time 15 --retry 5 --retry-delay 5

          echo "→ [3/3] API gateway responds..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${BASE}/api/v1/auth/me" --max-time 10)
          echo "   /api/v1/auth/me → HTTP $STATUS"
          [[ "$STATUS" =~ ^(200|400|401|403|404)$ ]] || \
            (echo "ERROR: unexpected HTTP $STATUS" && exit 1)

          echo "✓ All smoke tests passed"

      - name: Rollback staging on failure
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            echo "→ Rolling back..."
            docker stop foodwaste-backend-staging-new 2>/dev/null || true
            docker rm  foodwaste-backend-staging-new 2>/dev/null || true
            echo "✓ Rollback complete"

  # ============================================
  # Deploy to Production
  # ============================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, container-security]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    timeout-minutes: 15

    environment:
      name: production
      url: https://api.foodwaste.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            CONTAINER="foodwaste-backend-prod"
            ENV_FILE="/opt/foodwaste/production/.env"

            echo "→ Logging into GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u ${{ github.actor }} --password-stdin

            echo "→ Pulling image: $IMAGE"
            docker pull "$IMAGE"

            echo "→ Starting new container (blue/green swap)..."
            docker run -d \
              --name "${CONTAINER}-new" \
              --restart unless-stopped \
              --env-file "$ENV_FILE" \
              -p 3001:3000 \
              "$IMAGE"

            echo "→ Waiting for new container to be healthy (up to 60s)..."
            timeout 60 bash -c \
              "until docker exec ${CONTAINER}-new \
                  node -e \"require('http').get('http://localhost:3000/health/liveness', r => process.exit(r.statusCode === 200 ? 0 : 1))\" \
                  2>/dev/null; do sleep 3; done"

            echo "→ Swapping containers..."
            PREV=$(docker ps -q --filter "name=${CONTAINER}") || true
            if [ -n "$PREV" ]; then
              docker stop "$PREV"
              docker rm  "$PREV"
            fi
            docker rename "${CONTAINER}-new" "$CONTAINER"

            echo "→ Cleaning up old images (keep last 3)..."
            docker images "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" \
              --format "{{.ID}}" | tail -n +4 | xargs -r docker rmi || true

            echo "✓ Production deployment complete"

      - name: Smoke tests
        run: |
          BASE="https://api.foodwaste.com"

          echo "→ [1/3] Liveness probe..."
          curl -sf "${BASE}/health/liveness" \
            -H "Accept: application/json" \
            --max-time 10 --retry 5 --retry-delay 5 --retry-connrefused

          echo "→ [2/3] Readiness probe..."
          curl -sf "${BASE}/health/readiness" \
            -H "Accept: application/json" \
            --max-time 15 --retry 5 --retry-delay 5

          echo "→ [3/3] API gateway responds..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${BASE}/api/v1/auth/me" --max-time 10)
          echo "   /api/v1/auth/me → HTTP $STATUS"
          [[ "$STATUS" =~ ^(200|400|401|403|404)$ ]] || \
            (echo "ERROR: unexpected HTTP $STATUS" && exit 1)

          echo "✓ All smoke tests passed"

      - name: Notify deployment success
        if: success()
        run: echo "✓ Production deployment successful — ${{ github.sha }}"

      - name: Rollback production on failure
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            echo "→ Rolling back..."
            docker stop foodwaste-backend-prod-new 2>/dev/null || true
            docker rm  foodwaste-backend-prod-new 2>/dev/null || true
            echo "✓ Rollback complete"

  # ============================================
  # Performance Testing (Optional)
  # ============================================
  performance-test:
    name: Performance Test
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/develop'
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run load test
        run: |
          echo "Running k6 load tests..."
          # k6 run tests/load/basic-load-test.js

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: performance-results/
          # Without this the repo default (90 days) applies. Artifacts count
          # against the account's Actions storage quota, and on the Free plan
          # exceeding that quota blocks Actions entirely - it is not a monthly
          # allowance that resets.
          retention-days: 7

  # ============================================
  # Prune old container images
  # ============================================
  # Every push to a release branch publishes an image to ghcr.io, and nothing
  # removed the old ones. Package storage counts against the account quota, and
  # unlike Actions minutes it does not reset each month: once it is full, GitHub
  # refuses to start any workflow, which is how this pipeline came to sit idle
  # while every run reported a 0-second startup_failure.
  #
  # Keeps the 5 most recent versions. Untagged layers left by a rebuild are
  # deleted regardless, since nothing can pull them.
  prune-images:
    name: Prune Old Container Images
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push'
    timeout-minutes: 10
    permissions:
      packages: write

    steps:
      - name: Delete untagged image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}/backend
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 0

      - name: Keep only the 5 most recent tagged versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}/backend
          package-type: container
          min-versions-to-keep: 5

  # ============================================
  # Job 9 — Create production indexes
  #
  # `autoIndex` is off in production (app.module.ts), so declaring an index on a
  # schema does NOT create it there. Nothing does, until this runs. Before this
  # job existed the only route was a developer remembering to run the script
  # from a laptop, which is how ten TTL policies once came to be declared in
  # code and absent from the database.
  #
  # Why CI and not a Render pre-deploy command: the script needs `ts-node`,
  # `tsconfig-paths` and the `*.schema.ts` sources. All three are absent from
  # the production image — devDependencies are stripped, `tsconfig.build.json`
  # excludes `scripts/`, and only compiled `dist/*.js` is copied. A pre-deploy
  # hook runs inside that image and would fail with `ts-node: not found`.
  #
  # Safe to run on every deploy: `createIndexes()` is additive and idempotent —
  # it creates what is missing and never drops. Dropping stays a deliberate
  # manual act (see `db:audit-indexes`).
  #
  # Gated on integration-tests because that job already proves every declared
  # index is actually creatable, by building them against a throwaway database.
  # An index MongoDB rejects — `sparse` combined with `partialFilterExpression`,
  # say — silently never builds in any environment, and this is what catches it
  # before production sees it.
  # ============================================
  create-indexes-production:
    name: Create Production Indexes
    runs-on: ubuntu-latest
    needs: [integration-tests]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    timeout-minutes: 30

    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The schemas import @foodwaste/shared, which resolves to
      # packages/shared/dist — unbuilt, every schema fails to load.
      - name: Build workspace packages
        run: pnpm build:deps

      # Index builds compete with live traffic for IO, and a large collection
      # can take tens of minutes. Running after the deploy rather than before
      # means a slow build never blocks a rollout; new queries are briefly
      # unindexed, which is slow but correct.
      - name: Create indexes from schemas (additive — never drops)
        run: pnpm --filter @foodwaste/backend db:create-indexes
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      # Fails the job on MISSING or MISMATCHED. Extra indexes are reported but
      # do not fail: dropping is manual by design, so an index this repo no
      # longer declares is a decision for a human with `db:audit-indexes`.
      - name: Verify no index drift against production
        run: pnpm --filter @foodwaste/backend verify:indexes:strict
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
