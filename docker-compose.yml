# ============================================
# FOOD WASTE - DOCKER COMPOSE CONFIGURATION
# ============================================
#
# Full-stack development environment with:
# - MongoDB (Database)
# - Redis (Cache & Queue)
# - Backend API (NestJS)
# - Prometheus (Metrics)
# - Grafana (Visualization)
#
# Usage:
#   Start:   docker-compose up -d
#   Logs:    docker-compose logs -f
#   Stop:    docker-compose down
#   Clean:   docker-compose down -v
# ============================================

version: '3.9'

services:
  # ============================================
  # MongoDB Database
  # ============================================
  mongodb:
    image: mongo:7.0
    container_name: foodwaste-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: foodwaste
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - foodwaste-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    command: mongod --auth

  # ============================================
  # Redis Cache & Queue
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: foodwaste-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: >
      redis-server
      --requirepass redis_dev_password
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - foodwaste-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================
  # RabbitMQ Message Broker
  # ============================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: foodwaste-rabbitmq
    restart: unless-stopped
    ports:
      - '5672:5672' # AMQP protocol
      - '15672:15672' # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: rabbitmq_dev_password
      RABBITMQ_DEFAULT_VHOST: /foodwaste
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - foodwaste-network
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================
  # Backend API (NestJS)
  # ============================================
  backend:
    build:
      context: .
      dockerfile: apps/food-waste-backend/Dockerfile
      target: runner
    container_name: foodwaste-backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # Application
      NODE_ENV: development
      PORT: 3000

      # Database
      DATABASE_URL: mongodb://admin:password123@mongodb:27017/foodwaste?authSource=admin

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_dev_password
      REDIS_TLS: 'false'

      # RabbitMQ
      RABBITMQ_URL: amqp://admin:rabbitmq_dev_password@rabbitmq:5672/foodwaste
      RABBITMQ_ENABLED: 'false'
      RABBITMQ_ENABLED_EVENTS: ''
      RABBITMQ_EXCHANGE: foodwaste.events
      RABBITMQ_PREFETCH_COUNT: 10
      RABBITMQ_MESSAGE_TTL: 86400000

      # JWT (Development only - NEVER use these in production)
      JWT_SECRET: dev_jwt_secret_please_change_in_production
      JWT_REFRESH_SECRET: dev_jwt_refresh_secret_please_change_in_production
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d

      # Logging
      LOG_LEVEL: debug
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      # Mount logs for debugging
      - ./apps/food-waste-backend/logs:/app/apps/food-waste-backend/logs
      # Mount uploads for persistence
      - ./apps/food-waste-backend/uploads:/app/apps/food-waste-backend/uploads
    networks:
      - foodwaste-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/health/liveness', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================
  # Prometheus (Metrics Collection)
  # ============================================
  prometheus:
    image: prom/prometheus:latest
    container_name: foodwaste-prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - foodwaste-network
    depends_on:
      - backend

  # ============================================
  # Grafana (Metrics Visualization)
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: foodwaste-grafana
    restart: unless-stopped
    ports:
      - '3001:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_INSTALL_PLUGINS: grafana-piechart-panel,grafana-clock-panel
      GF_SERVER_ROOT_URL: http://localhost:3001
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - foodwaste-network

  # ============================================
  # Mongo Express (Optional - Database UI)
  # ============================================
  mongo-express:
    image: mongo-express:latest
    container_name: foodwaste-mongo-express
    restart: unless-stopped
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password123
      ME_CONFIG_MONGODB_URL: mongodb://admin:password123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - foodwaste-network

  # ============================================
  # Redis Commander (Optional - Redis UI)
  # ============================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: foodwaste-redis-commander
    restart: unless-stopped
    ports:
      - '8082:8081'
    environment:
      REDIS_HOSTS: local:redis:6379:0:redis_dev_password
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - foodwaste-network

# ============================================
# Networks
# ============================================
networks:
  foodwaste-network:
    driver: bridge
    name: foodwaste-network

# ============================================
# Persistent Volumes
# ============================================
volumes:
  mongodb_data:
    name: foodwaste-mongodb-data
  mongodb_config:
    name: foodwaste-mongodb-config
  redis_data:
    name: foodwaste-redis-data
  rabbitmq_data:
    name: foodwaste-rabbitmq-data
  prometheus_data:
    name: foodwaste-prometheus-data
  grafana_data:
    name: foodwaste-grafana-data
